          echo "CI workflow hygiene checks passed."

      - name: Validate JSON syntax
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import {
            extname,
            join,
            relative
          } from 'node:path';

          const failures =
            [];

          async function walk(
            directory
          ) {
            const entries =
              await readdir(
                directory,
                {
                  withFileTypes: true
                }
              );

            for (const entry of entries) {
              if (
                entry.name === '.git' ||
                entry.name === 'node_modules'
              ) {
                continue;
              }

              const fullPath =
                join(
                  directory,
                  entry.name
                );

              if (entry.isDirectory()) {
                await walk(fullPath);
                continue;
              }

              if (
                extname(entry.name).toLowerCase() !==
                '.json'
              ) {
                continue;
              }

              try {
                const source =
                  await readFile(
                    fullPath,
                    'utf8'
                  );

                JSON.parse(
                  source
                );
              } catch (error) {
                failures.push(
                  `${relative('.', fullPath)}: ${error.message}`
                );
              }
            }
          }

          await walk('.');

          if (failures.length) {
            console.error(
              'JSON syntax validation failed:'
            );
            console.error(
              [
                ...new Set(
                  failures
                )
              ].join('\n')
            );
            process.exit(1);
          }

          console.log(
            'All repository JSON files passed syntax validation.'
          );
          NODE

      - name: Run canonical database validation
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';

          const repositoryRoot =
            resolve('.');

          const nativeFetch =
            globalThis.fetch;

          globalThis.fetch =
            async (
              input,
              init = {}
            ) => {
              const value =
                typeof input === 'string'
                  ? input
                  : input?.url;

              if (!value) {
                throw new Error(
                  'CI fetch adapter received an empty URL.'
                );
              }

              const raw =
                String(value);

              /*
               * Canonical database validation is intentionally repository-local.
               * External HTTP(S) access is never permitted in this gate.
               */
              if (
                /^[a-z][a-z0-9+.-]*:\/\//i.test(raw) &&
                !raw.startsWith('file://')
              ) {
                throw new Error(
                  `External URL is not permitted during canonical database validation: ${raw}`
                );
              }

              let filePath;

              if (
                raw.startsWith(
                  'file://'
                )
              ) {
                filePath =
                  new URL(
                    raw
                  );
              } else {
                const normalized =
                  raw.replace(
                    /^\/+/,
                    ''
                  );

                filePath =
                  resolve(
                    repositoryRoot,
                    normalized
                  );
              }

              try {
                const body =
                  await readFile(
                    filePath
                  );

                return new Response(
                  body,
                  {
                    status: 200,
                    headers: {
                      'Content-Type':
                        'application/json'
                    }
                  }
                );
              } catch (error) {
                return new Response(
                  JSON.stringify({
                    error:
                      error.message,
                    path:
                      String(
                        filePath
                      )
                  }),
                  {
                    status: 404,
                    headers: {
                      'Content-Type':
                        'application/json'
                    }
                  }
                );
              }
            };

          let exitCode =
            0;

          try {
            const loader =
              await import(
                pathToFileURL(
                  resolve(
                    'js/database/loader.js'
                  )
                ).href
              );

            if (
              typeof loader.loadDatabase !==
              'function'
            ) {
              throw new Error(
                'js/database/loader.js does not export loadDatabase(). The canonical validation gate must use the project loader.'
              );
            }

            let result;

            try {
              result =
                await loader.loadDatabase({
                  includeAssessment:
                    true,
                  includeCentral:
                    true,
                  includeWestBengal:
                    true,
                  includeIndexes:
                    true,
                  includeI18n:
                    true,
                  validate:
                    true,
                  strict:
                    true
                });
            } catch (error) {
              exitCode =
                1;

              console.error(
                'DATABASE_VALIDATION_FAILED: canonical database validation threw an error.'
              );

              if (
                error?.stack
              ) {
                console.error(
                  error.stack
                );
              } else {
                console.error(
                  String(
                    error
                  )
                );
              }

              if (
                error?.details
              ) {
                console.error(
                  'Canonical validator details:'
                );
                console.error(
                  JSON.stringify(
                    error.details,
                    null,
                    2
                  )
                );
              }
            }

            if (
              result
            ) {
              const validation =
                result?.validation ??
                result ??
                {};

              const errors =
                Array.isArray(
                  validation.errors
                )
                  ? validation.errors
                  : [];

              const fatalErrors =
                Array.isArray(
                  validation.fatalErrors
                )
                  ? validation.fatalErrors
                  : [];

              const warnings =
                Array.isArray(
                  validation.warnings
                )
                  ? validation.warnings
                  : [];

              const validFlag =
                validation.valid;

              if (
                fatalErrors.length ||
                errors.length ||
                validFlag === false
              ) {
                exitCode =
                  1;

                console.error(
                  'DATABASE_VALIDATION_FAILED: canonical validator reported errors.'
                );

                if (
                  fatalErrors.length
                ) {
                  console.error(
                    'Fatal canonical database errors:'
                  );
                  console.error(
                    JSON.stringify(
                      fatalErrors,
                      null,
                      2
                    )
                  );
                }

                if (
                  errors.length
                ) {
                  console.error(
                    'Canonical database errors:'
                  );
                  console.error(
                    JSON.stringify(
                      errors,
                      null,
                      2
                    )
                  );
                }

                if (
                  validFlag === false &&
                  !errors.length &&
                  !fatalErrors.length
                ) {
                  console.error(
                    'The canonical validator reported valid=false without returning an error array.'
                  );
                }
              }

              console.log(
                JSON.stringify(
                  {
                    valid:
                      validFlag ??
                      true,
                    warnings:
                      warnings.length,
                    engineVersion:
                      validation.engineVersion ??
                      null
                  },
                  null,
                  2
                )
              );

              if (
                warnings.length
              ) {
                console.log(
                  'Canonical validation warnings:'
                );
                console.log(
                  JSON.stringify(
                    warnings,
                    null,
                    2
                  )
                );
              }

              if (
                exitCode === 0
              ) {
                console.log(
                  'Canonical database validation passed.'
                );
              }
            }
          } catch (error) {
            exitCode =
              1;

            console.error(
              'DATABASE_VALIDATION_FAILED: canonical database gate could not be executed.'
            );

            console.error(
              error?.stack ||
              String(error)
            );

            if (
              error?.details
            ) {
              console.error(
                'Canonical validator details:'
              );
              console.error(
                JSON.stringify(
                  error.details,
                  null,
                  2
                )
              );
            }
          } finally {
            globalThis.fetch =
              nativeFetch;
          }

          process.exitCode =
            exitCode;
          NODE
