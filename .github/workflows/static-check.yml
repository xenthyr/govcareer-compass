name: Static project checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: static-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-check:
    name: JavaScript, HTML and architecture checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Verify required architectural files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "index.html"
            "pages/ai.html"

            "js/app.js"
            "js/init.js"
            "js/config.js"
            "js/router.js"
            "js/navigation.js"
            "js/theme.js"
            "js/language.js"
            "js/search.js"
            "js/filters.js"
            "js/storage.js"

            "js/database/loader.js"
            "js/database/registry.js"
            "js/database/normalizer.js"
            "js/database/validators.js"
            "js/database/indexes.js"
            "js/database/cache.js"

            "js/recommendation/eligibility-engine.js"
            "js/recommendation/preference-engine.js"
            "js/recommendation/scoring-engine.js"
            "js/recommendation/ranking-engine.js"
            "js/recommendation/explanation-engine.js"

            "js/components/header.js"
            "js/components/footer.js"
            "js/components/ai-assistant.js"
            "js/components/search-bar.js"
            "js/components/state-selector.js"
            "js/components/language-selector.js"
            "js/components/theme-selector.js"

            "js/ai/client.js"
            "js/ai/context-builder.js"
            "js/ai/prompt-builder.js"
            "js/ai/response-parser.js"
            "js/ai/safety.js"
            "js/ai/intent-router.js"

            "api/chat.mjs"
            "api/health.mjs"
            "api/_lib/config.mjs"
            "api/_lib/security.mjs"
            "api/_lib/compass-prompt.mjs"

            "data/schemas/job.schema.json"
            "data/schemas/eligibility-rule.schema.json"
            "data/schemas/service-cadre.schema.json"

            "data/common/categories.json"
            "data/common/confidence-levels.json"
            "data/common/glossary.json"
            "data/common/governments.json"
            "data/common/locations.json"
            "data/common/qualifications.json"
            "data/common/scoring-rules.json"
            "data/common/source-types.json"
            "data/common/states.json"
            "data/common/statuses.json"

            "data/central/exams.json"
            "data/central/jobs.json"
            "data/central/departments.json"
            "data/central/organisations.json"
            "data/central/service-cadres.json"
            "data/central/eligibility-rules.json"

            "data/states/west-bengal/exams.json"
            "data/states/west-bengal/jobs.json"
            "data/states/west-bengal/departments.json"
            "data/states/west-bengal/organisations.json"
            "data/states/west-bengal/service-cadres.json"
            "data/states/west-bengal/eligibility-rules.json"

            "data/indexes/job-index.json"
            "data/indexes/exam-index.json"
            "data/indexes/department-index.json"
            "data/indexes/source-index.json"
            "data/indexes/service-cadre-index.json"
            "data/indexes/eligibility-rule-index.json"
            "data/indexes/qualification-index.json"
            "data/indexes/search-index.json"
          )

          missing=()

          for path in "${required_files[@]}"; do
            if [[ ! -f "$path" ]]; then
              missing+=("$path")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Required architectural file check failed:" >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

          echo "All required architectural files are present."

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          files=()

          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -type f -name '*.js' -print0 |
              sort -z
          )

          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -type f -name '*.mjs' -print0 |
              sort -z
          )

          if (( ${#files[@]} == 0 )); then
            echo "No JavaScript modules found." >&2
            exit 1
          fi

          failed=0

          for file in "${files[@]}"; do
            if ! node --check "$file"; then
              echo "JavaScript syntax error: $file" >&2
              failed=1
            fi
          done

          if (( failed != 0 )); then
            echo "JavaScript syntax validation failed." >&2
            exit 1
          fi

          echo "All JavaScript and .mjs modules passed syntax checks."

      - name: Check HTML structure and local resources
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import {
            dirname,
            extname,
            join,
            relative,
            resolve
          } from 'node:path';

          const repositoryRoot = resolve('.');
          const failures = [];

          function resolveLocalHtmlResource(
            htmlFile,
            resource
          ) {
            if (resource.startsWith('/')) {
              return resolve(
                repositoryRoot,
                resource.slice(1)
              );
            }

            return resolve(
              dirname(htmlFile),
              resource
            );
          }

          function stripUrlSuffix(value) {
            return value.split(/[?#]/, 1)[0];
          }

          function isExternalResource(value) {
            return (
              /^(?:https?:)?\/\//i.test(value) ||
              /^data:/i.test(value) ||
              /^mailto:/i.test(value) ||
              /^tel:/i.test(value) ||
              /^javascript:/i.test(value) ||
              value.startsWith('#')
            );
          }

          async function walk(directory) {
            const entries =
              await readdir(
                directory,
                {
                  withFileTypes: true
                }
              );

            for (const entry of entries) {
              if (
                entry.name === '.git' ||
                entry.name === 'node_modules'
              ) {
                continue;
              }

              const fullPath =
                join(
                  directory,
                  entry.name
                );

              if (entry.isDirectory()) {
                await walk(fullPath);
                continue;
              }

              if (
                extname(entry.name).toLowerCase() !==
                '.html'
              ) {
                continue;
              }

              const text =
                await readFile(
                  fullPath,
                  'utf8'
                );

              const path =
                relative(
                  repositoryRoot,
                  resolve(fullPath)
                );

              if (
                !/^\s*<!doctype\s+html\s*>/i.test(
                  text
                )
              ) {
                failures.push(
                  `${path}: missing HTML5 doctype at the beginning of the document.`
                );
              }

              if (
                !/<html\b[^>]*>/i.test(text)
              ) {
                failures.push(
                  `${path}: missing <html> root element.`
                );
              }

              if (
                !/<head\b[^>]*>/i.test(text) ||
                !/<\/head>/i.test(text)
              ) {
                failures.push(
                  `${path}: missing or malformed <head> section.`
                );
              }

              if (
                !/<body\b[^>]*>/i.test(text) ||
                !/<\/body>/i.test(text)
              ) {
                failures.push(
                  `${path}: missing or malformed <body> section.`
                );
              }

              if (
                !/<title\b[^>]*>[^<]+<\/title>/i.test(
                  text
                )
              ) {
                failures.push(
                  `${path}: missing non-empty <title>.`
                );
              }

              const scriptTags =
                [
                  ...text.matchAll(
                    /<script\b[^>]*src=["']([^"']+)["'][^>]*>/gi
                  )
                ];

              for (const match of scriptTags) {
                const src = match[1];

                if (
                  isExternalResource(src) ||
                  /^\/api\//i.test(src)
                ) {
                  continue;
                }

                const queryless =
                  stripUrlSuffix(src);

                if (!queryless) {
                  failures.push(
                    `${path}: empty local script source.`
                  );
                  continue;
                }

                const target =
                  resolveLocalHtmlResource(
                    resolve(fullPath),
                    queryless
                  );

                try {
                  await readFile(target);
                } catch {
                  failures.push(
                    `${path}: script source does not exist: ${src} (resolved to ${relative(repositoryRoot, target) || '.'})`
                  );
                }
              }

              const linkTags =
                [
                  ...text.matchAll(
                    /<link\b[^>]*href=["']([^"']+)["'][^>]*>/gi
                  )
                ];

              for (const match of linkTags) {
                const href = match[1];

                if (
                  isExternalResource(href)
                ) {
                  continue;
                }

                const queryless =
                  stripUrlSuffix(href);

                if (!queryless) {
                  failures.push(
                    `${path}: empty local link href.`
                  );
                  continue;
                }

                const target =
                  resolveLocalHtmlResource(
                    resolve(fullPath),
                    queryless
                  );

                try {
                  await readFile(target);
                } catch {
                  failures.push(
                    `${path}: linked local resource does not exist: ${href} (resolved to ${relative(repositoryRoot, target) || '.'})`
                  );
                }
              }

              const opening =
                (
                  text.match(
                    /<script\b/gi
                  ) || []
                ).length;

              const closing =
                (
                  text.match(
                    /<\/script>/gi
                  ) || []
                ).length;

              if (
                opening !== closing
              ) {
                failures.push(
                  `${path}: unbalanced <script> tags (${opening} opening, ${closing} closing).`
                );
              }

              if (
                /<button\b/i.test(text) &&
                !/<button\b[^>]*type=["'][^"']+["']/i.test(
                  text
                )
              ) {
                failures.push(
                  `${path}: contains <button> without an explicit type attribute.`
                );
              }
            }
          }

          await walk(repositoryRoot);

          if (failures.length) {
            console.error(
              'HTML structural/static validation failed:'
            );
            console.error(
              [
                ...new Set(
                  failures
                )
              ].join('\n')
            );
            process.exit(1);
          }

          console.log(
            'HTML structural and local-resource checks passed.'
          );
          NODE

      - name: Check local JavaScript imports
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { access, readdir, readFile } from 'node:fs/promises';
          import {
            dirname,
            extname,
            join,
            relative,
            resolve
          } from 'node:path';

          const repositoryRoot = resolve('.');
          const failures = [];

          const staticImportPattern =
            /(?:^|[\n;])\s*(?:import\s+(?:[^'";]+?\s+from\s+)?|export\s+(?:[^'";]+?\s+from\s+))['"]([^'"]+)['"]/g;

          const dynamicImportPattern =
            /import\(\s*['"]([^'"]+)['"]\s*\)/g;

          async function exists(file) {
            try {
              await access(file);
              return true;
            } catch {
              return false;
            }
          }

          function isLocalSpecifier(
            specifier
          ) {
            return (
              specifier.startsWith('./') ||
              specifier.startsWith('../') ||
              specifier.startsWith('/')
            );
          }

          function resolveImportBase(
            fromFile,
            specifier
          ) {
            if (
              specifier.startsWith('/')
            ) {
              return resolve(
                repositoryRoot,
                specifier.slice(1)
              );
            }

            return resolve(
              dirname(fromFile),
              specifier
            );
          }

          async function resolveImport(
            fromFile,
            specifier
          ) {
            if (
              !isLocalSpecifier(
                specifier
              )
            ) {
              return null;
            }

            const base =
              resolveImportBase(
                fromFile,
                specifier
              );

            const candidates = [
              base,
              `${base}.js`,
              `${base}.mjs`,
              `${base}.json`,
              join(base, 'index.js'),
              join(base, 'index.mjs')
            ];

            for (const candidate of candidates) {
              if (
                await exists(
                  candidate
                )
              ) {
                return candidate;
              }
            }

            return null;
          }

          async function walk(
            directory
          ) {
            const entries =
              await readdir(
                directory,
                {
                  withFileTypes: true
                }
              );

            for (const entry of entries) {
              if (
                entry.name === '.git' ||
                entry.name === 'node_modules'
              ) {
                continue;
              }

              const file =
                join(
                  directory,
                  entry.name
                );

              if (entry.isDirectory()) {
                await walk(file);
                continue;
              }

              const extension =
                extname(
                  entry.name
                ).toLowerCase();

              if (
                extension !== '.js' &&
                extension !== '.mjs'
              ) {
                continue;
              }

              const source =
                await readFile(
                  file,
                  'utf8'
                );

              const specifiers =
                [];

              for (
                const match of
                source.matchAll(
                  staticImportPattern
                )
              ) {
                specifiers.push(
                  match[1]
                );
              }

              for (
                const match of
                source.matchAll(
                  dynamicImportPattern
                )
              ) {
                specifiers.push(
                  match[1]
                );
              }

              for (
                const specifier of
                specifiers
              ) {
                const target =
                  await resolveImport(
                    resolve(file),
                    specifier
                  );

                if (!target) {
                  failures.push(
                    `${relative(repositoryRoot, resolve(file))}: missing local import target: ${specifier}`
                  );
                }
              }
            }
          }

          await walk(repositoryRoot);

          if (failures.length) {
            console.error(
              'Local JavaScript import validation failed:'
            );
            console.error(
              [
                ...new Set(
                  failures
                )
              ].join('\n')
            );
            process.exit(1);
          }

          console.log(
            'Local JavaScript import checks passed.'
          );
          NODE

      - name: Check page-controller mappings
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { access, readFile } from 'node:fs/promises';
          import {
            dirname,
            relative,
            resolve
          } from 'node:path';

          const repositoryRoot =
            resolve('.');

          const appFile =
            resolve(
              'js/app.js'
            );

          const source =
            await readFile(
              appFile,
              'utf8'
            );

          const mapMatch =
            source.match(
              /const\s+PAGE_CONTROLLER_MAP\s*=\s*Object\.freeze\(\s*\{([\s\S]*?)\}\s*\)\s*;/
            );

          if (!mapMatch) {
            console.error(
              'PAGE_CONTROLLER_MAP validation failed: canonical PAGE_CONTROLLER_MAP declaration was not found in js/app.js.'
            );
            process.exit(1);
          }

          const mapBody =
            mapMatch[1];

          const entryPattern =
            /(?:^|,)\s*(?:(['"])([^'"]+)\1|([A-Za-z0-9_-]+))\s*:\s*(["'])([^"']+)\4\s*(?=,|$)/g;

          const entries =
            [];

          for (
            const match of
            mapBody.matchAll(
              entryPattern
            )
          ) {
            entries.push({
              page:
                match[2] ||
                match[3],
              modulePath:
                match[5]
            });
          }

          /*
           * Batch 1 may legitimately keep the map empty.
           * A missing declaration is an error; an empty declaration is not.
           */
          if (
            entries.length === 0
          ) {
            console.log(
              'PAGE_CONTROLLER_MAP contains no registered page controllers; controller module validation is skipped.'
            );
            process.exit(0);
          }

          const failures = [];
          const seenPages = new Set();
          const seenPaths = new Set();

          for (
            const {
              page,
              modulePath
            } of entries
          ) {
            if (
              seenPages.has(page)
            ) {
              failures.push(
                `Duplicate page-controller key "${page}" in PAGE_CONTROLLER_MAP.`
              );
            }

            if (
              seenPaths.has(modulePath)
            ) {
              failures.push(
                `Duplicate page-controller path "${modulePath}" in PAGE_CONTROLLER_MAP.`
              );
            }

            seenPages.add(page);
            seenPaths.add(modulePath);

            if (
              !(
                modulePath.startsWith('./') ||
                modulePath.startsWith('../')
              )
            ) {
              failures.push(
                `Page "${page}" has invalid controller path "${modulePath}". Expected a repository-relative path.`
              );
              continue;
            }

            const controllerFile =
              resolve(
                dirname(
                  appFile
                ),
                modulePath
              );

            const relativeTarget =
              relative(
                repositoryRoot,
                controllerFile
              );

            if (
              relativeTarget === '..' ||
              relativeTarget.startsWith('../') ||
              relativeTarget.includes('/../')
            ) {
              failures.push(
                `Page "${page}" controller path escapes the repository: ${modulePath}`
              );
              continue;
            }

            try {
              await access(
                controllerFile
              );
            } catch {
              failures.push(
                `Page "${page}" maps to missing controller module: ${modulePath}`
              );
            }
          }

          if (failures.length) {
            console.error(
              'PAGE_CONTROLLER_MAP validation failed:'
            );
            console.error(
              [
                ...new Set(
                  failures
                )
              ].join('\n')
            );
            process.exit(1);
          }

          console.log(
            `PAGE_CONTROLLER_MAP validation passed: ${entries.length} declared controller module(s) verified.`
          );
          NODE

      - name: Check repository-local references
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { access, readdir, readFile } from 'node:fs/promises';
          import {
            dirname,
            extname,
            join,
            relative,
            resolve
          } from 'node:path';

          const repositoryRoot =
            resolve('.');

          const failures =
            [];

          async function exists(
            path
          ) {
            try {
              await access(
                path
              );
              return true;
            } catch {
              return false;
            }
          }

          function shouldCheck(
            value
          ) {
            if (
              !value ||
              value.startsWith('#')
            ) {
              return false;
            }

            if (
              /^(?:https?:|mailto:|tel:|data:|javascript:)/i.test(
                value
              )
            ) {
              return false;
            }

            if (
              /^\/\//.test(
                value
              )
            ) {
              return false;
            }

            return true;
          }

          async function walk(
            directory
          ) {
            const entries =
              await readdir(
                directory,
                {
                  withFileTypes: true
                }
              );

            for (const entry of entries) {
              if (
                entry.name === '.git' ||
                entry.name === 'node_modules'
              ) {
                continue;
              }

              const file =
                join(
                  directory,
                  entry.name
                );

              if (entry.isDirectory()) {
                await walk(file);
                continue;
              }

              if (
                extname(entry.name).toLowerCase() !==
                '.html'
              ) {
                continue;
              }

              const source =
                await readFile(
                  file,
                  'utf8'
                );

              const localPath =
                relative(
                  repositoryRoot,
                  resolve(file)
                );

              const attributes =
                [
                  ...source.matchAll(
                    /(?:href|src|action|data-src)=["']([^"']+)["']/gi
                  )
                ].map(
                  match => match[1]
                );

              for (
                const target of
                attributes
              ) {
                if (
                  !shouldCheck(
                    target
                  )
                ) {
                  continue;
                }

                const clean =
                  target.split(
                    /[?#]/,
                    1
                  )[0];

                if (!clean) {
                  continue;
                }

                const candidates =
                  clean.startsWith('/')
                    ? [
                        resolve(
                          repositoryRoot,
                          clean.slice(1)
                        )
                      ]
                    : [
                        resolve(
                          dirname(
                            resolve(file)
                          ),
                          clean
                        ),
                        resolve(
                          repositoryRoot,
                          clean
                        )
                      ];

                let found =
                  false;

                for (
                  const candidate of
                  candidates
                ) {
                  if (
                    await exists(
                      candidate
                    )
                  ) {
                    found = true;
                    break;
                  }
                }

                if (!found) {
                  const looksLikeFile =
                    /\.(?:html?|css|js|mjs|json|svg|png|jpe?g|webp|ico|woff2?|ttf)$/i.test(
                      clean
                    );

                  if (
                    looksLikeFile
                  ) {
                    failures.push(
                      `${localPath}: broken local repository reference: ${target}`
                    );
                  }
                }
              }
            }
          }

          await walk(repositoryRoot);

          if (failures.length) {
            console.error(
              'Repository-local reference validation failed:'
            );
            console.error(
              [
                ...new Set(
                  failures
                )
              ].join('\n')
            );
            process.exit(1);
          }

          console.log(
            'Repository-local reference checks passed.'
          );
          NODE

      - name: Check prohibited secret patterns
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import {
            extname,
            join,
            relative
          } from 'node:path';

          const failures =
            [];

          const allowedFiles =
            new Set([
              '.github/workflows/static-check.yml',
              '.github/workflows/data-validation.yml'
            ]);

          const textExtensions =
            new Set([
              '.js',
              '.mjs',
              '.cjs',
              '.json',
              '.html',
              '.css',
              '.scss',
              '.md',
              '.yml',
              '.yaml',
              '.txt',
              '.env',
              '.example'
            ]);

          const patterns = [
            {
              name:
                'OpenAI-style API key',
              regex:
                /\bsk-[A-Za-z0-9_-]{20,}\b/g
            },
            {
              name:
                'OpenRouter-style API key',
              regex:
                /\bsk-or-v1-[A-Za-z0-9]{20,}\b/g
            },
            {
              name:
                'GitHub personal access token',
              regex:
                /\bghp_[A-Za-z0-9]{30,}\b/g
            },
            {
              name:
                'GitHub fine-grained token',
              regex:
                /\bgithub_pat_[A-Za-z0-9_]{30,}\b/g
            },
            {
              name:
                'AWS access key ID',
              regex:
                /\bAKIA[0-9A-Z]{16}\b/g
            },
            {
              name:
                'Private key material',
              regex:
                /-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----/g
            },
            {
              name:
                'Hard-coded bearer token',
              regex:
                /\bAuthorization\s*:\s*Bearer\s+[A-Za-z0-9._-]{24,}\b/gi
            },
            {
              name:
                'Hard-coded secret assignment',
              regex:
                /\b(?:api[_-]?key|secret|client[_-]?secret|access[_-]?token|refresh[_-]?token)\s*[:=]\s*["'][^"']{20,}["']/gi
            }
          ];

          async function walk(
            directory
          ) {
            const entries =
              await readdir(
                directory,
                {
                  withFileTypes: true
                }
              );

            for (const entry of entries) {
              if (
                entry.name === '.git' ||
                entry.name === 'node_modules'
              ) {
                continue;
              }

              const file =
                join(
                  directory,
                  entry.name
                );

              if (entry.isDirectory()) {
                await walk(file);
                continue;
              }

              const path =
                relative(
                  '.',
                  file
                );

              if (
                allowedFiles.has(
                  path
                )
              ) {
                continue;
              }

              if (
                !textExtensions.has(
                  extname(
                    entry.name
                  ).toLowerCase()
                )
              ) {
                continue;
              }

              const source =
                await readFile(
                  file,
                  'utf8'
                );

              for (
                const pattern of
                patterns
              ) {
                pattern.regex.lastIndex =
                  0;

                if (
                  pattern.regex.test(
                    source
                  )
                ) {
                  failures.push(
                    `${path}: prohibited ${pattern.name} pattern detected.`
                  );
                }
              }
            }
          }

          await walk('.');

          if (failures.length) {
            console.error(
              'Potential secret patterns detected:'
            );
            console.error(
              [
                ...new Set(
                  failures
                )
              ].join('\n')
            );
            process.exit(1);
          }

          console.log(
            'No prohibited secret patterns were detected.'
          );
          NODE

      - name: Check required workflow hygiene
        shell: bash
        run: |
          set -euo pipefail

          test -f .github/workflows/data-validation.yml
          test -f .github/workflows/static-check.yml

          grep -q '^permissions:' .github/workflows/static-check.yml
