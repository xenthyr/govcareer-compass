      y1="52"
      x2="256"
      y2="78"
      stroke="#24CBE9"
      stroke-width="2.2"
      stroke-opacity="0.220"
    />

    <line
      x1="256"
      y1="126"
      x2="256"
      y2="142"
      stroke="#1CB5D3"
      stroke-width="1.8"
      stroke-opacity="0.180"
    />

    <!-- South -->
    <line
      x1="256"
      y1="434"
      x2="256"
      y2="456"
      stroke="#123E57"
      stroke-width="1.8"
      stroke-opacity="0.120"
    />

    <line
      x1="256"
      y1="370"
      x2="256"
      y2="384"
      stroke="#168BA8"
      stroke-width="1.5"
      stroke-opacity="0.100"
    />

    <!-- East -->
    <line
      x1="434"
      y1="256"
      x2="456"
      y2="256"
      stroke="#168BA8"
      stroke-width="1.8"
      stroke-opacity="0.120"
    />

    <line
      x1="370"
      y1="256"
      x2="384"
      y2="256"
      stroke="#168BA8"
      stroke-width="1.5"
      stroke-opacity="0.100"
    />

    <!-- West -->
    <line
      x1="56"
      y1="256"
      x2="78"
      y2="256"
      stroke="#123E57"
      stroke-width="1.8"
      stroke-opacity="0.120"
    />

    <line
      x1="128"
      y1="256"
      x2="142"
      y2="256"
      stroke="#168BA8"
      stroke-width="1.5"
      stroke-opacity="0.100"
    />


    <!-- =====================================================
         SECONDARY PRECISION TICKS
         Eight diagonal navigation ticks
         ===================================================== -->

    <g
      stroke="#168BA8"
      stroke-width="1.2"
      stroke-opacity="0.080"
    >

      <line
        x1="344"
        y1="104"
        x2="336"
        y2="118"
      />

      <line
        x1="408"
        y1="168"
        x2="394"
        y2="176"
      />

      <line
        x1="408"
        y1="344"
        x2="394"
        y2="336"
      />

      <line
        x1="344"
        y1="408"
        x2="336"
        y2="394"
      />

      <line
        x1="168"
        y1="408"
        x2="176"
        y2="394"
      />

      <line
        x1="104"
        y1="344"
        x2="118"
        y2="336"
      />

      <line
        x1="104"
        y1="168"
        x2="118"
        y2="176"
      />

      <line
        x1="168"
        y1="104"
        x2="176"
        y2="118"
      />

    </g>

  </g>


  <!-- =========================================================
       LAYER 5 — DIRECTIONAL HIGHLIGHT ACCENTS
       Purpose: subtle forward/northeast visual emphasis
       ========================================================= -->

