<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  preserveAspectRatio="xMidYMid meet"
  fill="none"
  role="presentation"
  aria-hidden="true"
>
  <defs>

    <!-- GovCareer Compass technology-to-cyan highlight gradient -->
    <linearGradient
      id="govCareerCompassAccentGradient"
      x1="0%"
      y1="100%"
      x2="100%"
      y2="0%"
    >
      <stop offset="0%" stop-color="#168BA8"/>
      <stop offset="55%" stop-color="#1CB5D3"/>
      <stop offset="100%" stop-color="#24CBE9"/>
    </linearGradient>

  </defs>


  <!-- =========================================================
       LAYER 1 — OUTER ATMOSPHERIC COMPASS RING
       Radius: approximately 226
       Purpose: broad navigation boundary and depth
       ========================================================= -->

  <g
    id="govCareerCompassOuterRing"
    stroke-linecap="round"
    stroke-linejoin="round"
  >

    <!-- Upper arc -->
    <path
      d="M256 30
         A226 226 0 0 1 476 220"
      stroke="#123E57"
      stroke-width="1.2"
      stroke-opacity="0.055"
    />

    <!-- Lower-right arc -->
    <path
      d="M480 268
         A226 226 0 0 1 292 480"
      stroke="#123E57"
      stroke-width="1.2"
      stroke-opacity="0.050"
    />

    <!-- Lower-left arc -->
    <path
      d="M236 481
         A226 226 0 0 1 32 284"
      stroke="#168BA8"
      stroke-width="1.2"
      stroke-opacity="0.060"
    />

    <!-- Upper-left arc -->
    <path
      d="M34 228
         A226 226 0 0 1 228 31"
      stroke="#123E57"
      stroke-width="1.2"
      stroke-opacity="0.050"
    />

  </g>


  <!-- =========================================================
       LAYER 2 — PRIMARY COMPASS RING
       Radius: 188
       Purpose: primary structural navigation circle
       ========================================================= -->

  <g
    id="govCareerCompassPrimaryRing"
    stroke-linecap="round"
    stroke-linejoin="round"
  >

    <!-- Segmented primary ring -->
    <circle
      cx="256"
      cy="256"
      r="188"
      stroke="#123E57"
      stroke-width="1.5"
      stroke-opacity="0.080"
      stroke-dasharray="140 18 90 22 220 24"
    />

    <!-- Northeast technology segment -->
    <path
      d="M389 123
         A188 188 0 0 1 444 256"
      stroke="#168BA8"
      stroke-width="1.75"
      stroke-opacity="0.120"
    />

    <!-- Southwest balancing segment -->
    <path
      d="M123 389
         A188 188 0 0 1 68 256"
      stroke="#168BA8"
      stroke-width="1.75"
      stroke-opacity="0.090"
    />

  </g>


  <!-- =========================================================
       LAYER 3 — DIRECTIONAL NAVIGATION RING
       Radius: approximately 145
       Purpose: movement, exploration, guidance
       ========================================================= -->

  <g
    id="govCareerCompassNavigationArcs"
    stroke-linecap="round"
    stroke-linejoin="round"
  >

    <!-- Northeast-oriented primary navigation arc -->
    <path
      d="M256 111
         A145 145 0 0 1 395 214"
      stroke="#168BA8"
      stroke-width="2"
      stroke-opacity="0.140"
    />

    <!-- East/southeast navigation arc -->
    <path
      d="M401 256
         A145 145 0 0 1 346 364"
      stroke="#1CB5D3"
      stroke-width="1.8"
      stroke-opacity="0.110"
    />

    <!-- Southern balancing arc -->
    <path
      d="M314 389
         A145 145 0 0 1 176 377"
      stroke="#123E57"
      stroke-width="1.6"
      stroke-opacity="0.080"
    />

    <!-- Western navigation arc -->
    <path
      d="M131 335
         A145 145 0 0 1 114 212"
      stroke="#168BA8"
      stroke-width="1.8"
      stroke-opacity="0.100"
    />

