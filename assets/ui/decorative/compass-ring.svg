    id="govCareerCompassDirectionalAccents"
    stroke-linecap="round"
    stroke-linejoin="round"
  >

    <!-- Primary northeast guidance arc -->
    <path
      d="M284 115
         A145 145 0 0 1 382 185"
      stroke="url(#govCareerCompassAccentGradient)"
      stroke-width="2.5"
      stroke-opacity="0.220"
    />

    <!-- Southwest counterbalance -->
    <path
      d="M218 396
         A145 145 0 0 1 152 352"
      stroke="#123E57"
      stroke-width="2"
      stroke-opacity="0.110"
    />

    <!-- Secondary inner guidance segment -->
    <path
      d="M312 180
         A98 98 0 0 1 354 256"
      stroke="#1CB5D3"
      stroke-width="1.8"
      stroke-opacity="0.160"
    />

  </g>


  <!-- =========================================================
       LAYER 6 — QUIET CENTRAL NAVIGATION HUB
       Purpose: preserve center for content and compositional depth
       ========================================================= -->

  <g
    id="govCareerCompassCenter"
    stroke-linecap="round"
    stroke-linejoin="round"
  >

    <!-- Delicate central navigation ring -->
    <circle
      cx="256"
      cy="256"
      r="32"
      stroke="#168BA8"
      stroke-width="1.2"
      stroke-opacity="0.090"
    />

    <!-- Small precision ring -->
    <circle
      cx="256"
      cy="256"
      r="14"
      stroke="#1CB5D3"
      stroke-width="1"
      stroke-opacity="0.120"
      stroke-dasharray="4 4"
    />

    <!-- Minimal center point -->
    <circle
      cx="256"
      cy="256"
      r="2"
      fill="#24CBE9"
      fill-opacity="0.200"
      stroke="none"
    />

  </g>

</svg>