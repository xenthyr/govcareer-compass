<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  preserveAspectRatio="xMidYMid meet"
  role="presentation"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <!--
      GovCareer Compass directional accent gradient.
      Deep institutional teal transitions into intelligent cyan.
    -->
    <linearGradient
      id="govCareerDataOrbitAccentGradient"
      x1="0%"
      y1="100%"
      x2="100%"
      y2="0%"
    >
      <stop offset="0%" stop-color="#168BA8"/>
      <stop offset="55%" stop-color="#1CB5D3"/>
      <stop offset="100%" stop-color="#24CBE9"/>
    </linearGradient>

    <!--
      Subtle radial atmosphere for active intelligence nodes.
      Kept intentionally soft for decorative background use.
    -->
    <radialGradient
      id="govCareerDataOrbitNodeGlow"
      cx="50%"
      cy="50%"
      r="50%"
    >
      <stop offset="0%" stop-color="#24CBE9" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#1CB5D3" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1CB5D3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- =====================================================
       LAYER 1 — ATMOSPHERIC OUTER ORBIT
       Large, quiet background structure.
       ===================================================== -->

  <g
    id="govCareerDataOrbitOuterStructure"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
    vector-effect="non-scaling-stroke"
  >
    <ellipse
      cx="256"
      cy="256"
      rx="215"
      ry="145"
      transform="rotate(-25 256 256)"
      stroke="#123E57"
      stroke-width="1.4"
      stroke-opacity="0.065"
      stroke-dasharray="190 28 120 22 280 34"
    />
  </g>

  <!-- =====================================================
       LAYER 2 — PRIMARY INFORMATION ORBITS
       Represents interconnected government career data.
       ===================================================== -->

  <g
    id="govCareerDataOrbitPrimaryPaths"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
    vector-effect="non-scaling-stroke"
  >
    <ellipse
      cx="260"
      cy="250"
      rx="160"
      ry="110"
      transform="rotate(35 260 250)"
      stroke="#168BA8"
      stroke-width="1.6"
      stroke-opacity="0.10"
      stroke-dasharray="140 18 80 14 180 20"
    />

    <path
      d="M118 282
         C142 172 338 150 402 230"
      stroke="#168BA8"
      stroke-width="1.2"
      stroke-opacity="0.075"
      stroke-dasharray="70 12 110 16"
    />
  </g>

  <!-- =====================================================
       LAYER 3 — INNER TECHNICAL ORBIT
       Adds analytical and computational character.
       ===================================================== -->

  <g
    id="govCareerDataOrbitTechnicalPaths"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
    vector-effect="non-scaling-stroke"
  >
    <ellipse
      cx="248"
      cy="262"
      rx="85"
      ry="60"
      transform="rotate(-40 248 262)"
      stroke="#168BA8"
      stroke-width="1.2"
      stroke-opacity="0.08"
      stroke-dasharray="24 8 48 10 16 6"
    />

    <path
      d="M210 240
         A55 40 25 0 1 290 270"
      stroke="#123E57"
      stroke-width="1.4"
      stroke-opacity="0.09"
      stroke-dasharray="8 6 18 6"
    />
  </g>

  <!-- =====================================================
       LAYER 4 — ACTIVE INTELLIGENT GUIDANCE FLOW
       The strongest directional movement is toward northeast,
       matching the GovCareer Compass navigation language.
       ===================================================== -->

  <g
    id="govCareerDataOrbitActiveFlow"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
    vector-effect="non-scaling-stroke"
  >
    <!-- Primary forward trajectory -->
    <path
      d="M176 342
         C226 362 338 334 382 208"
      stroke="url(#govCareerDataOrbitAccentGradient)"
      stroke-width="2.2"
      stroke-opacity="0.20"
    />

    <!-- Forward acceleration -->
    <path
      d="M330 150
         C376 164 410 198 420 238"
      stroke="#1CB5D3"
      stroke-width="1.8"
      stroke-opacity="0.15"
    />

    <!-- Subtle incoming trajectory -->
    <path
      d="M96 290
         C114 320 146 344 188 354"
      stroke="#168BA8"
      stroke-width="1.5"
      stroke-opacity="0.11"
    />
  </g>

  <!-- =====================================================
       LAYER 5 — PASSIVE BACKGROUND DATA NODES
       Quiet informational points.
       ===================================================== -->

  <g
    id="govCareerDataOrbitBackgroundNodes"
    fill="#168BA8"
    fill-opacity="0.085"
  >
    <circle cx="96" cy="205" r="2"/>
    <circle cx="132" cy="155" r="1.8"/>
    <circle cx="184" cy="115" r="2"/>
    <circle cx="425" cy="310" r="1.7"/>
    <circle cx="370" cy="385" r="2.2"/>
    <circle cx="295" cy="402" r="1.8"/>
    <circle cx="150" cy="340" r="2"/>
    <circle cx="215" cy="225" r="1.6"/>
  </g>

  <!-- =====================================================
       LAYER 6 — CONNECTED STRUCTURAL NODES
       Slightly stronger intersections representing
       connected opportunities and eligibility data.
       ===================================================== -->

  <g id="govCareerDataOrbitConnectedNodes">
    <circle
      cx="165"
      cy="245"
      r="2.8"
      fill="#1CB5D3"
      fill-opacity="0.13"
    />

    <circle
      cx="310"
      cy="180"
      r="3.2"
      fill="#1CB5D3"
      fill-opacity="0.15"
    />

    <circle
      cx="345"
      cy="295"
      r="2.7"
      fill="#1CB5D3"
      fill-opacity="0.12"
    />

    <circle
      cx="230"
      cy="350"
      r="3"
      fill="#1CB5D3"
      fill-opacity="0.14"
    />

    <circle
      cx="275"
      cy="148"
      r="2.8"
      fill="#168BA8"
      fill-opacity="0.13"
    />

    <circle
      cx="395"
      cy="255"
      r="3"
      fill="#1CB5D3"
      fill-opacity="0.15"
    />
  </g>

  <!-- =====================================================
       LAYER 7 — ACTIVE INTELLIGENCE NODES
       These provide subtle focal points without becoming
       too visually dominant over page content.
       ===================================================== -->

  <g id="govCareerDataOrbitActiveNodes">

    <!-- Northeast guidance target halo -->
    <circle
      cx="382"
      cy="208"
      r="16"
      fill="url(#govCareerDataOrbitNodeGlow)"
      opacity="0.7"
    />

    <circle
      cx="382"
      cy="208"
      r="4.2"
      fill="#24CBE9"
      fill-opacity="0.26"
    />

    <circle
      cx="382"
      cy="208"
      r="1.6"
      fill="#CCF7FF"
      fill-opacity="0.62"
    />

    <!-- Central analytical intersection -->
    <circle
      cx="290"
      cy="235"
      r="12"
      fill="url(#govCareerDataOrbitNodeGlow)"
      opacity="0.35"
    />

    <circle
      cx="290"
      cy="235"
      r="3.8"
      fill="#1CB5D3"
      fill-opacity="0.22"
    />

    <!-- Upward trajectory intelligence point -->
    <circle
      cx="355"
      cy="160"
      r="11"
      fill="url(#govCareerDataOrbitNodeGlow)"
      opacity="0.28"
    />

    <circle
      cx="355"
      cy="160"
      r="3.5"
      fill="#24CBE9"
      fill-opacity="0.20"
    />

  </g>
</svg>