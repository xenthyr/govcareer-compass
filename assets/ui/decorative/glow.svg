<?xml version="1.0" encoding="UTF-8"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  preserveAspectRatio="xMidYMid meet"
  role="presentation"
  aria-hidden="true"
>
  <defs>

    <!--
      GovCareer Compass Decorative Glow System

      Layer hierarchy:
      1. Ambient institutional atmosphere
      2. Primary intelligent guidance glow
      3. Focused cyan highlight
    -->

    <!-- Large atmospheric glow -->
    <radialGradient
      id="govCareerGlowAmbient"
      cx="50%"
      cy="50%"
      r="50%"
    >
      <stop
        offset="0%"
        stop-color="#168BA8"
        stop-opacity="0.055"
      />
      <stop
        offset="48%"
        stop-color="#168BA8"
        stop-opacity="0.025"
      />
      <stop
        offset="100%"
        stop-color="#168BA8"
        stop-opacity="0"
      />
    </radialGradient>

    <!-- Primary technology and guidance glow -->
    <radialGradient
      id="govCareerGlowPrimary"
      cx="50%"
      cy="50%"
      r="50%"
    >
      <stop
        offset="0%"
        stop-color="#1CB5D3"
        stop-opacity="0.11"
      />
      <stop
        offset="45%"
        stop-color="#1CB5D3"
        stop-opacity="0.055"
      />
      <stop
        offset="100%"
        stop-color="#1CB5D3"
        stop-opacity="0"
      />
    </radialGradient>

    <!-- Focused intelligent guidance highlight -->
    <radialGradient
      id="govCareerGlowHighlight"
      cx="50%"
      cy="50%"
      r="50%"
    >
      <stop
        offset="0%"
        stop-color="#24CBE9"
        stop-opacity="0.15"
      />
      <stop
        offset="42%"
        stop-color="#24CBE9"
        stop-opacity="0.07"
      />
      <stop
        offset="100%"
        stop-color="#24CBE9"
        stop-opacity="0"
      />
    </radialGradient>

  </defs>

  <!--
    Asymmetrical multi-layer glow composition.

    The focal point is intentionally shifted slightly toward
    the upper-right area to create visual direction and prevent
    the decoration from looking mechanically centered.
  -->

  <!-- Layer 1: Wide atmospheric diffusion -->
  <ellipse
    id="govCareerGlowAmbientLayer"
    cx="276"
    cy="238"
    rx="232"
    ry="214"
    fill="url(#govCareerGlowAmbient)"
  />

  <!-- Layer 2: Primary guidance glow -->
  <ellipse
    id="govCareerGlowPrimaryLayer"
    cx="290"
    cy="248"
    rx="168"
    ry="156"
    fill="url(#govCareerGlowPrimary)"
  />

  <!-- Layer 3: Focused intelligent highlight -->
  <ellipse
    id="govCareerGlowHighlightLayer"
    cx="304"
    cy="258"
    rx="96"
    ry="90"
    fill="url(#govCareerGlowHighlight)"
  />

</svg>