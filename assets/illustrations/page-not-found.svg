<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 900"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-labelledby="pageNotFoundTitle pageNotFoundDesc"
>
  <title id="pageNotFoundTitle">
    GovCareer Compass — Page Not Found
  </title>

  <desc id="pageNotFoundDesc">
    A premium modern vector illustration representing a navigation route
    that cannot reach its requested destination. The GovCareer Compass AI
    navigation engine detects the unresolved route, recalculates direction,
    and guides navigation toward a valid alternative path.
  </desc>

  <defs>

    <!-- ========================================================= -->
    <!-- GRADIENTS -->
    <!-- ========================================================= -->

    <!-- Premium glass surface -->
    <linearGradient
      id="pnfGlassGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >
      <stop
        offset="0%"
        stop-color="#F2F6FB"
        stop-opacity="0.12"
      />
      <stop
        offset="55%"
        stop-color="#DCEAF4"
        stop-opacity="0.055"
      />
      <stop
        offset="100%"
        stop-color="#F2F6FB"
        stop-opacity="0.02"
      />
    </linearGradient>

    <!-- Primary cyan intelligence flow -->
    <linearGradient
      id="pnfCyanGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
    >
      <stop
        offset="0%"
        stop-color="#79E2F2"
        stop-opacity="0"
      />
      <stop
        offset="25%"
        stop-color="#35CEE6"
        stop-opacity="0.75"
      />
      <stop
        offset="75%"
        stop-color="#12B7D3"
        stop-opacity="0.85"
      />
      <stop
        offset="100%"
        stop-color="#79E2F2"
        stop-opacity="0"
      />
    </linearGradient>

    <!-- Cyan vertical energy -->
    <linearGradient
      id="pnfCyanVerticalGradient"
      x1="0%"
      y1="0%"
      x2="0%"
      y2="100%"
    >
      <stop
        offset="0%"
        stop-color="#79E2F2"
        stop-opacity="0"
      />
      <stop
        offset="50%"
        stop-color="#35CEE6"
        stop-opacity="0.75"
      />
      <stop
        offset="100%"
        stop-color="#12B7D3"
        stop-opacity="0"
      />
    </linearGradient>

    <!-- Violet AI intelligence -->
    <linearGradient
      id="pnfVioletGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >
      <stop
        offset="0%"
        stop-color="#C0A3FB"
      />
      <stop
        offset="100%"
        stop-color="#9564DF"
      />
    </linearGradient>

    <!-- Emerald successful route -->
    <linearGradient
      id="pnfEmeraldGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
    >
      <stop
        offset="0%"
        stop-color="#5DE7B2"
        stop-opacity="0.35"
      />
      <stop
        offset="100%"
        stop-color="#10A875"
        stop-opacity="1"
      />
    </linearGradient>

    <!-- Violet AI core -->
    <radialGradient
      id="pnfVioletCoreGradient"
      cx="50%"
      cy="50%"
      r="50%"
      fx="50%"
      fy="50%"
    >
      <stop
        offset="0%"
        stop-color="#D4BFFF"
      />
      <stop
        offset="65%"
        stop-color="#9564DF"
      />
      <stop
        offset="100%"
        stop-color="#6136A8"
      />
    </radialGradient>

    <!-- Ambient intelligence glow -->
    <radialGradient
      id="pnfAmbientGlowGradient"
      cx="50%"
      cy="50%"
      r="50%"
    >
      <stop
        offset="0%"
        stop-color="#12B7D3"
        stop-opacity="0.075"
      />
      <stop
        offset="100%"
        stop-color="#0D1C31"
        stop-opacity="0"
      />
    </radialGradient>

    <!-- Compass needle -->
    <linearGradient
      id="pnfNeedleGradient"
      x1="0%"
      y1="0%"
      x2="0%"
      y2="100%"
    >
      <stop
        offset="0%"
        stop-color="#CCF7FF"
      />
      <stop
        offset="50%"
        stop-color="#12B7D3"
      />
      <stop
        offset="100%"
        stop-color="#0D2840"
      />
    </linearGradient>


    <!-- ========================================================= -->
    <!-- FILTERS -->
    <!-- ========================================================= -->

    <!-- Cyan glow -->
    <filter
      id="pnfCyanGlow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        in="SourceGraphic"
        stdDeviation="6"
        result="blur"
      />

      <feFlood
        flood-color="#12B7D3"
        flood-opacity="0.5"
        result="flood"
      />

      <feComposite
        in="flood"
        in2="blur"
        operator="in"
        result="glow"
      />

      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>


    <!-- Violet glow -->
    <filter
      id="pnfVioletGlow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        in="SourceGraphic"
        stdDeviation="9"
        result="blur"
      />

      <feFlood
        flood-color="#9564DF"
        flood-opacity="0.6"
        result="flood"
      />

      <feComposite
        in="flood"
        in2="blur"
        operator="in"
        result="glow"
      />

      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>


    <!-- Emerald success glow -->
    <filter
      id="pnfEmeraldGlow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        in="SourceGraphic"
        stdDeviation="5"
        result="blur"
      />

      <feFlood
        flood-color="#10A875"
        flood-opacity="0.55"
        result="flood"
      />

      <feComposite
        in="flood"
        in2="blur"
        operator="in"
        result="glow"
      />

      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>


    <!-- Premium glass shadow -->
    <filter
      id="pnfGlassShadow"
      x="-25%"
      y="-25%"
      width="150%"
      height="150%"
    >
      <feGaussianBlur
        in="SourceAlpha"
        stdDeviation="9"
        result="blur"
      />

      <feOffset
        dx="0"
        dy="7"
        result="offsetBlur"
      />

      <feFlood
        flood-color="#081C2C"
        flood-opacity="0.16"
        result="shadowColor"
      />

      <feComposite
        in="shadowColor"
        in2="offsetBlur"
        operator="in"
        result="shadow"
      />

      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

  </defs>


  <!-- ========================================================= -->
  <!-- AMBIENT BACKGROUND -->
  <!-- ========================================================= -->

  <g id="pnfAmbientBackground">

    <circle
      cx="600"
      cy="450"
      r="410"
      fill="url(#pnfAmbientGlowGradient)"
    />

    <g
      stroke="#0D2840"
      stroke-width="1"
      opacity="0.055"
      fill="none"
    >

      <line
        x1="0"
        y1="450"
        x2="1200"
        y2="450"
      />

      <line
        x1="600"
        y1="0"
        x2="600"
        y2="900"
      />

      <circle
        cx="600"
        cy="450"
        r="300"
        stroke-dasharray="10 20"
      />

    </g>

  </g>


  <!-- ========================================================= -->
  <!-- LEFT ZONE — UNRESOLVED REQUEST -->
  <!-- ========================================================= -->

  <g
    id="pnfRequestedDestination"
    transform="translate(170,450)"
    filter="url(#pnfGlassShadow)"
  >

    <rect
      x="-105"
      y="-125"
      width="210"
      height="250"
      rx="22"
      fill="url(#pnfGlassGradient)"
      stroke="#F2F6FB"
      stroke-width="1.5"
      stroke-opacity="0.2"
    />


    <!-- Route attempt -->

    <g
      transform="translate(-65,-55)"
      fill="none"
      stroke-linecap="round"
    >

      <path
        d="M0 0 C30 0 45 0 75 0"
        stroke="#35CEE6"
        stroke-width="2.5"
        opacity="0.7"
      />

      <!-- Route termination -->

      <path
        d="M75 -15 V15"
        stroke="#79E2F2"
        stroke-width="3"
        opacity="0.75"
      />

      <circle
        cx="75"
        cy="0"
        r="14"
        fill="none"
        stroke="#79E2F2"
        stroke-width="1.5"
        stroke-dasharray="4 5"
        opacity="0.4"
      />

    </g>


    <!-- Broken navigation indicators -->

    <g
      transform="translate(-65,5)"
      fill="none"
      stroke="#1C567A"
      stroke-width="2"
      stroke-linecap="round"
      opacity="0.5"
    >

      <path d="M0 0 H35" />

      <path
        d="M50 0 H90"
        stroke-dasharray="6 7"
      />

      <circle
        cx="42"
        cy="0"
        r="4"
        fill="#1C567A"
        stroke="none"
      />

    </g>


    <!-- Abstract unresolved information -->

    <g
      transform="translate(-65,55)"
      fill="#1C567A"
      opacity="0.35"
    >

      <rect
        width="90"
        height="6"
        rx="3"
      />

      <rect
        y="18"
        width="115"
        height="6"
        rx="3"
      />

      <rect
        y="36"
        width="70"
        height="6"
        rx="3"
      />

    </g>

  </g>


  <!-- ========================================================= -->
  <!-- REQUEST FLOW -->
  <!-- ========================================================= -->

  <g
    id="pnfRequestFlow"
    transform="translate(280,450)"
    fill="none"
    stroke-linecap="round"
  >

    <path
      d="M0 0 C90 0 160 0 250 0"
      stroke="url(#pnfCyanGradient)"
      stroke-width="4"
      filter="url(#pnfCyanGlow)"
    />

    <path
      d="M0 -32 C90 -28 160 -18 250 -8"
      stroke="#1C567A"
      stroke-width="2"
      opacity="0.22"
    />

    <path
      d="M0 32 C90 28 160 18 250 8"
      stroke="#1C567A"
      stroke-width="2"
      opacity="0.22"
    />

    <circle
      cx="110"
      cy="0"
      r="5"
      fill="#35CEE6"
      opacity="0.7"
    />

    <circle
      cx="185"
      cy="-14"
      r="3.5"
      fill="#35CEE6"
      opacity="0.4"
    />

    <circle
      cx="185"
      cy="14"
      r="3.5"
      fill="#35CEE6"
      opacity="0.4"
    />

  </g>


  <!-- ========================================================= -->
  <!-- CENTRAL FOCAL POINT — COMPASS AI NAVIGATION ENGINE -->
  <!-- ========================================================= -->

  <g
    id="pnfCompassAiNavigationEngine"
    transform="translate(600,450)"
  >

    <!-- Outer intelligence rings -->

    <circle
      r="185"
      fill="none"
      stroke="#5E68E5"
      stroke-width="1.5"
      stroke-opacity="0.14"
    />

    <circle
      r="152"
      fill="none"
      stroke="#35CEE6"
      stroke-width="1"
      stroke-dasharray="8 13"
      opacity="0.28"
    />

    <circle
      r="122"
      fill="url(#pnfGlassGradient)"
      stroke="#79E2F2"
      stroke-width="2"
      stroke-opacity="0.5"
      filter="url(#pnfCyanGlow)"
    />


    <!-- Compass arcs -->

    <g
      stroke="#79E2F2"
      stroke-width="3"
      stroke-linecap="round"
      fill="none"
    >

      <path
        d="M0 -112 A112 112 0 0 1 112 0"
      />

      <path
        d="M0 112 A112 112 0 0 0 -112 0"
        opacity="0.45"
      />

    </g>


    <!-- Cardinal markers -->

    <g
      stroke="#79E2F2"
      stroke-width="2.5"
      opacity="0.7"
      fill="none"
    >

      <line x1="0" y1="-112" x2="0" y2="-92" />

      <line x1="0" y1="112" x2="0" y2="92" />

      <line x1="-112" y1="0" x2="-92" y2="0" />

      <line x1="112" y1="0" x2="92" y2="0" />

    </g>


    <!-- AI route recalculation arcs -->

    <g
      fill="none"
      stroke-linecap="round"
    >

      <!-- Unresolved route -->

      <path
        d="M-145 0
           Q-145 -60 -105 -105"
        stroke="#79E2F2"
        stroke-width="2.5"
        stroke-dasharray="5 7"
        opacity="0.25"
      />

      <!-- Analysis orbit -->

      <path
        d="M-90 -135
           Q0 -175 90 -135"
        stroke="#35CEE6"
        stroke-width="2"
        stroke-opacity="0.22"
      />

      <!-- Recalculated successful direction -->

      <path
        d="M0 145
           Q65 140 112 95"
        stroke="#10A875"
        stroke-width="3"
        stroke-opacity="0.55"
        filter="url(#pnfEmeraldGlow)"
      />

      <circle
        cx="112"
        cy="95"
        r="6"
        fill="#34D399"
        filter="url(#pnfEmeraldGlow)"
      />

    </g>


    <!-- Compass needle oriented toward successful route -->

    <g transform="rotate(-135)">

      <path
        d="M0 -100
           L15 0
           L0 20
           L-15 0
           Z"
        fill="url(#pnfNeedleGradient)"
        stroke="#FFFFFF"
        stroke-width="1"
      />

      <path
        d="M0 -100
           L15 0
           L0 5
           L-15 0
           Z"
        fill="#FFFFFF"
        opacity="0.58"
      />

    </g>


    <!-- AI containment ring -->

    <circle
      r="60"
      fill="#0D2840"
      fill-opacity="0.22"
      stroke="#35CEE6"
      stroke-width="2"
      stroke-opacity="0.5"
    />


    <!-- AI intelligence core -->

    <g filter="url(#pnfVioletGlow)">

      <circle
        r="30"
        fill="url(#pnfVioletCoreGradient)"
      />

      <circle
        r="12"
        fill="#DDFBFD"
        fill-opacity="0.65"
      />

    </g>


    <!-- Analytical nodes -->

    <g
      fill="#35CEE6"
      opacity="0.8"
    >

      <circle
        cx="88"
        cy="-88"
        r="5"
      />

      <circle
        cx="-132"
        cy="20"
        r="4"
      />

      <circle
        cx="30"
        cy="138"
        r="4"
      />

    </g>

  </g>


  <!-- ========================================================= -->
  <!-- CENTER-TO-RIGHT ROUTE REORIENTATION -->
  <!-- ========================================================= -->

  <g
    id="pnfReorientationFlow"
    transform="translate(750,450)"
    fill="none"
    stroke-linecap="round"
  >

    <!-- Abandoned direct route -->

    <path
      d="M0 0 C80 0 120 0 200 0"
      stroke="#1C567A"
      stroke-width="2"
      stroke-opacity="0.28"
      stroke-dasharray="6 9"
    />


    <!-- Analytical alternative -->

    <path
      d="M0 0
         C80 0 125 -70 205 -105"
      stroke="url(#pnfCyanGradient)"
      stroke-width="3"
      filter="url(#pnfCyanGlow)"
    />


    <!-- Successful route -->

    <path
      d="M0 0
         C80 0 125 70 205 105"
      stroke="url(#pnfEmeraldGradient)"
      stroke-width="3.5"
      filter="url(#pnfEmeraldGlow)"
    />


    <!-- Route nodes -->

    <circle
      cx="95"
      cy="0"
      r="4"
      fill="#35CEE6"
      opacity="0.6"
    />

    <circle
      cx="160"
      cy="-72"
      r="3"
      fill="#35CEE6"
      opacity="0.55"
    />

    <circle
      cx="165"
      cy="80"
      r="4"
      fill="#34D399"
      filter="url(#pnfEmeraldGlow)"
    />

  </g>


  <!-- ========================================================= -->
  <!-- RIGHT ZONE — VALID ALTERNATIVE DESTINATION -->
  <!-- ========================================================= -->

  <g
    id="pnfDestinationPanel"
    transform="translate(1000,450)"
    filter="url(#pnfGlassShadow)"
  >

    <rect
      x="-105"
      y="-125"
      width="210"
      height="250"
      rx="22"
      fill="url(#pnfGlassGradient)"
      stroke="#F2F6FB"
      stroke-width="1.5"
      stroke-opacity="0.2"
    />


    <!-- Unavailable option -->

    <g
      transform="translate(-72,-72)"
      opacity="0.45"
    >

      <circle
        cx="0"
        cy="0"
        r="10"
        fill="none"
        stroke="#79E2F2"
        stroke-width="1.5"
        stroke-dasharray="4 4"
      />

      <path
        d="M22 0 H120"
        stroke="#1C567A"
        stroke-width="2"
      />

    </g>


    <!-- Recalculated option -->

    <g
      transform="translate(-72,-15)"
    >

      <circle
        cx="0"
        cy="0"
        r="10"
        fill="#0D2840"
        fill-opacity="0.12"
        stroke="#35CEE6"
        stroke-width="2"
      />

      <path
        d="M22 0 H130"
        stroke="#35CEE6"
        stroke-width="2.5"
        opacity="0.65"
      />

    </g>


    <!-- Successful destination -->

    <g
      transform="translate(-72,55)"
      filter="url(#pnfEmeraldGlow)"
    >

      <circle
        cx="0"
        cy="0"
        r="13"
        fill="#10A875"
        fill-opacity="0.16"
        stroke="#10A875"
        stroke-width="3"
      />

      <path
        d="M-6 0
           L0 6
           L10 -6"
        stroke="#34D399"
        stroke-width="3"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="M25 0 H150"
        stroke="url(#pnfEmeraldGradient)"
        stroke-width="3.5"
        stroke-linecap="round"
      />

    </g>


    <!-- Destination signal -->

    <g
      transform="translate(82,-105)"
      opacity="0.65"
    >

      <circle
        r="13"
        fill="none"
        stroke="#35CEE6"
        stroke-width="1.5"
      />

      <circle
        r="4"
        fill="#35CEE6"
      />

    </g>

  </g>


  <!-- ========================================================= -->
  <!-- AMBIENT PARTICLES -->
  <!-- ========================================================= -->

  <g
    id="pnfAmbientParticles"
    opacity="0.32"
  >

    <circle
      cx="200"
      cy="200"
      r="3"
      fill="#F2F6FB"
    />

    <circle
      cx="1000"
      cy="100"
      r="2.5"
      fill="#F2F6FB"
    />

    <circle
      cx="1100"
      cy="800"
      r="3"
      fill="#F2F6FB"
    />

    <circle
      cx="150"
      cy="750"
      r="2"
      fill="#F2F6FB"
    />

    <circle
      cx="600"
      cy="150"
      r="2.5"
      fill="#F2F6FB"
    />

    <circle
      cx="450"
      cy="820"
      r="3"
      fill="#F2F6FB"
    />

    <circle
      cx="850"
      cy="150"
      r="2"
      fill="#35CEE6"
    />

    <circle
      cx="780"
      cy="760"
      r="2"
      fill="#34D399"
    />

  </g>

</svg>